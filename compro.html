<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>วิทยาลัยอาชีวศึกษาสุพรรณบุรี - รับสมัครนักศึกษา</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #12082b;
        --card: #241350;
        --ac: #00e5a0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #fff;
        font-family: Kanit, system-ui, sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        text-align: center;
      }
      #app {
        position: relative;
        z-index: 1;
        max-width: 980px;
        height: calc(100vh - 30px);
        height: calc(100dvh - 30px);
        margin: 0 auto;
        padding: 42px 16px 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: auto;
      }
      #app:has(.stage) {
        max-width: 1240px;
      }
      #app:has(.boss-shell) {
        max-width: 1100px;
      }
      #app > * {
        max-width: 100%;
      }
      p,
      h2 {
        margin: 0.3em 0;
      }
      h1 {
        font-size: clamp(1.3rem, 4.5vh, 1.9rem);
        margin: 0.15em 0;
      }
      h1 span {
        color: var(--ac);
      }
      .mq {
        position: relative;
        z-index: 2;
        background: #ffd400;
        color: #000;
        overflow: hidden;
        white-space: nowrap;
        font-weight: 700;
        padding: 4px 0;
      }
      .mq div {
        display: inline-block;
        animation: mq 14s linear infinite;
      }
      @keyframes mq {
        from {
          transform: translateX(100vw);
        }
        to {
          transform: translateX(-100%);
        }
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 8px;
        width: 100%;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: clamp(6px, 1.6vh, 14px);
        cursor: pointer;
        font-size: 1.05rem;
        opacity: 0.55;
        transform: scale(0.92);
      }
      .card em {
        display: block;
        font-size: clamp(1.4rem, 4.5vh, 2.2rem);
        font-style: normal;
      }
      .card.hot {
        grid-column: 1/-1;
        opacity: 1;
        transform: none;
        background: linear-gradient(135deg, #7c3aed, #00b37a);
        font-size: 1.5rem;
        animation: glow 1s infinite alternate;
      }
      @keyframes glow {
        from {
          box-shadow: 0 0 10px #00e5a0;
        }
        to {
          box-shadow: 0 0 40px #ffd400;
          transform: scale(1.03);
        }
      }
      .b {
        background: linear-gradient(135deg, #7c3aed, #db2777);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font: inherit;
        font-size: 1.05rem;
        cursor: pointer;
        margin: 6px;
      }
      .b:active {
        transform: scale(0.95);
      }
      .sm {
        font-size: 2rem;
        padding: 8px 14px;
      }
      .sk {
        background: #555;
        font-size: 0.85rem;
      }
      input {
        font: inherit;
        font-size: 1.1rem;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid var(--ac);
        background: #fff;
        color: #000;
        max-width: 100%;
      }
      .bar {
        background: #0006;
        border-radius: 10px;
        height: 16px;
        overflow: hidden;
        margin: 10px auto;
        max-width: 420px;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #00e5a0, #ffd400);
        transition: width 0.2s;
      }
      .big {
        font-size: clamp(2.5rem, 9vh, 4rem);
      }
      .gr {
        display: grid;
        grid-template-columns: repeat(3, min(80px, 11vh));
        gap: 8px;
        justify-content: center;
      }
      .h {
        height: min(80px, 11vh);
        font-size: 2rem;
        border-radius: 14px;
        border: 0;
        background: #4a2c1a;
      }
      .arena {
        position: relative;
        height: min(230px, 30vh);
        width: min(420px, 100%);
        margin: auto;
        background: #0004;
        border-radius: 14px;
        overflow: hidden;
      }
      #t {
        position: absolute;
        font-size: 2.4rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      #nav {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 30px);
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        padding: 4px;
      }
      .nv {
        transition:
          left 0.15s,
          top 0.15s;
        background: #374151;
        font-size: 0.9rem;
        padding: 8px 12px;
      }
      .nv.legs::after {
        content: "🦵🦵";
        position: absolute;
        left: 50%;
        bottom: -20px;
        transform: translateX(-50%);
        animation: run 0.2s infinite alternate;
      }
      @keyframes run {
        to {
          transform: translateX(-50%) rotate(15deg);
        }
      }
      .half {
        position: fixed;
        z-index: 99;
        background: #374151;
        color: #fff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        animation: fall 1.3s forwards;
        font-size: 0.9rem;
      }
      .half.l {
        clip-path: inset(0 50% 0 0);
        --d: -1;
      }
      .half.r {
        clip-path: inset(0 0 0 50%);
        --d: 1;
      }
      @keyframes fall {
        to {
          transform: translate(calc(var(--d) * 120px), 120vh)
            rotate(calc(var(--d) * 90deg));
          opacity: 0;
        }
      }
      #app.shake {
        animation: sh 0.1s infinite;
      }
      @keyframes sh {
        25% {
          transform: translate(6px, -4px) rotate(1deg);
        }
        75% {
          transform: translate(-6px, 4px) rotate(-1deg);
        }
      }
      .die {
        animation: die 2s forwards;
      }
      @keyframes die {
        30% {
          transform: rotate(30deg) scale(1.3);
        }
        to {
          transform: translateY(300px) rotate(720deg);
          opacity: 0;
        }
      }
      .pop {
        position: fixed;
        z-index: 60;
        background: #fff;
        color: #000;
        border: 3px solid red;
        border-radius: 10px;
        padding: 10px;
        max-width: 220px;
        font-size: 0.95rem;
      }
      .pop button {
        margin-top: 6px;
        background: #16a34a;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #000c;
        padding: 10px 18px;
        border-radius: 20px;
        z-index: 99;
        max-width: 90%;
      }
      .cf {
        position: fixed;
        top: -40px;
        font-size: 2rem;
        animation: cf 3s linear forwards;
        z-index: 40;
      }
      @keyframes cf {
        to {
          transform: translateY(110vh) rotate(360deg);
        }
      }
      .m {
        max-height: 22vh;
        max-width: 90%;
        border-radius: 12px;
      }
      .flash {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000a;
        pointer-events: none;
      }
      .flash img {
        max-height: 70vh;
        max-width: 80vw;
        animation: zp 0.3s;
      }
      @keyframes zp {
        from {
          transform: scale(0.2);
        }
      }
      .scream {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        display: flex;
        justify-content: center;
      }
      .scream video {
        height: 100%;
        max-width: 100%;
      }
      .pop img {
        width: 90px;
        display: block;
        margin: auto;
      }
      .bx {
        position: relative;
        width: min(680px, 100%);
        aspect-ratio: 36/17;
        max-height: min(34vh, 280px);
        border: 2px solid #ff9a52;
        border-radius: 18px;
        background:
          linear-gradient(#ffffff09 1px, transparent 1px),
          linear-gradient(90deg, #ffffff09 1px, transparent 1px),
          radial-gradient(ellipse at center, #34203a, #080a14 75%);
        background-size:
          24px 24px,
          24px 24px,
          auto;
        margin: 12px auto;
        display: flex;
        align-items: center;
        overflow: hidden;
        box-shadow: inset 0 0 36px #000b, 0 0 24px #ff8a3d25;
      }
      #dl {
        padding: clamp(12px, 3vw, 24px);
        font-family: monospace;
        font-size: clamp(0.9rem, 2.2vh, 1.1rem);
        width: 100%;
        text-align: left;
      }
      #cv {
        width: 100%;
        height: 100%;
        display: none;
      }
      .ub {
        background: #000;
        border: 3px solid #f90;
        color: #f90;
        border-radius: 0;
        padding: 6px 12px;
        font-size: 1rem;
        margin: 3px;
      }
      .ub:hover {
        background: #f90;
        color: #000;
      }
      .boss-shell {
        width: min(860px, 100%);
        padding: clamp(14px, 2.5vw, 26px);
        background:
          radial-gradient(ellipse at 50% 0%, #ff9a5220, transparent 56%),
          linear-gradient(145deg, #221534f2, #10182af2);
        border: 1px solid #ff9a5270;
        border-radius: 26px;
        box-shadow: 0 28px 80px #0007, 0 0 36px #ff8a3d20;
      }
      .boss-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        text-align: left;
        border-bottom: 1px solid #ffffff20;
        padding-bottom: 12px;
      }
      .boss-kicker {
        color: #ffb06e;
        font: 700 0.72rem/1.5 monospace;
        letter-spacing: 0.14em;
      }
      .boss-title {
        margin: 2px 0 !important;
        font-size: clamp(1.15rem, 3vh, 1.6rem);
      }
      .boss-subtitle {
        margin: 0;
        color: #ffffff9e;
        font-size: 0.82rem;
      }
      .boss-avatar {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: clamp(72px, 13vh, 110px);
        aspect-ratio: 1;
        background: radial-gradient(circle, #ff9a5238, #ff9a520a 70%);
        border: 1px solid #ff9a5260;
        border-radius: 50%;
      }
      .boss-avatar img {
        width: 86%;
        max-height: 90%;
        object-fit: contain;
        filter: drop-shadow(0 8px 10px #0008);
      }
      .boss-hud {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        margin: 14px 0 10px;
      }
      .boss-meter-label {
        display: flex;
        justify-content: space-between;
        color: #ffd1ad;
        font: 700 0.75rem/1.4 monospace;
      }
      .boss-bar {
        max-width: none;
        height: 12px;
        margin: 5px 0 0;
        background: #090b12;
        border: 1px solid #ffffff20;
      }
      .boss-bar i {
        background: linear-gradient(90deg, #ff4d6d, #ff9a52);
      }
      .boss-stats {
        display: flex;
        gap: 8px;
      }
      .boss-stat {
        min-width: 76px;
        padding: 7px 10px;
        background: #ffffff0d;
        border: 1px solid #ffffff1a;
        border-radius: 12px;
      }
      .boss-stat > span {
        display: block;
        color: #ffffff9e;
        font-size: 0.68rem;
      }
      .boss-stat strong {
        font-size: 1rem;
      }
      .boss-stat small {
        margin-left: 2px;
        color: #ffffff8c;
        font-size: 0.72rem;
      }
      .boss-hint {
        min-height: 1.4em;
        margin: 4px 0 8px;
        color: #ffffff9e;
        font-size: 0.78rem;
      }
      .boss-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
      }
      .boss-actions .ub {
        min-width: 112px;
        border-radius: 10px;
      }
      body.is-phone .b,
      body.is-phone .ub {
        min-height: 44px;
      }
      body.is-phone .boss-actions .ub {
        flex: 1 1 42%;
      }
      body.is-phone .game-side {
        display: none;
      }
      body.is-phone .panel {
        flex: 1 1 100%;
        min-height: min(54vh, 500px);
      }
      body.is-phone .boss-shell {
        padding: 14px 10px;
        border-radius: 18px;
      }
      body.is-phone .boss-hud {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      body.is-phone .boss-stats {
        justify-content: stretch;
      }
      body.is-phone .boss-stat {
        flex: 1;
      }
      body {
        animation: bg 30s infinite;
      }
      @keyframes bg {
        0%,
        100% {
          background: #12082b;
        }
        20% {
          background: #0b2a3a;
        }
        40% {
          background: #0f3a22;
        }
        60% {
          background: #3a2a0b;
        }
        80% {
          background: #3a0b2e;
        }
      }
      .dc {
        position: fixed;
        bottom: -60px;
        opacity: 0.15;
        z-index: -1;
        pointer-events: none;
        animation: rise linear infinite;
        font-family: monospace;
      }
      @keyframes rise {
        to {
          transform: translateY(-115vh) rotate(90deg);
        }
      }
      #cat-rain-layer {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .rc {
        position: absolute;
        top: -100px;
        opacity: var(--opacity, 0.16);
        filter: drop-shadow(0 3px 8px #0008);
        will-change: transform;
        animation: cat-fall var(--duration, 12s) linear forwards;
      }
      @keyframes cat-fall {
        to {
          transform: translate3d(var(--drift, 0px), calc(100vh + 200px), 0)
            rotate(350deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #cat-rain-layer {
          display: none;
        }
      }
      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vw, 22px);
        width: 100%;
        max-width: 1120px;
      }
      .game-side {
        position: relative;
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 0;
        max-width: 220px;
      }
      .side-card {
        display: grid;
        gap: 2px;
        width: min(100%, 190px);
        padding: 10px 12px;
        text-align: left;
        background: linear-gradient(145deg, #211540dd, #102d3bdd);
        border: 1px solid #ffffff30;
        border-radius: 14px;
        box-shadow: 0 10px 30px #0003, inset 0 1px #ffffff18;
        transform: rotate(-3deg);
      }
      .game-side.r .side-card {
        text-align: right;
        transform: rotate(3deg);
      }
      .side-card span {
        color: var(--ac);
        font: 700 0.68rem/1.4 monospace;
        letter-spacing: 0.12em;
      }
      .side-card strong {
        font-size: 1rem;
      }
      .side-card small {
        opacity: 0.7;
        font-size: 0.78rem;
      }
      .side-sticker {
        padding: 7px 12px;
        color: #ffe580;
        font-size: 0.82rem;
        background: #251b3ecc;
        border: 1px dashed #ffe58080;
        border-radius: 999px;
        transform: rotate(4deg);
      }
      .game-side.r .side-sticker {
        transform: rotate(-4deg);
      }
      .panel {
        position: relative;
        isolation: isolate;
        flex: 1 1 660px;
        max-width: 700px;
        min-height: min(58vh, 520px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, #7c3aed2b, transparent 62%),
          linear-gradient(145deg, #ffffff16, #ffffff08);
        border: 1px solid #00e5a080;
        border-radius: 24px;
        padding: clamp(16px, 2.5vh, 24px);
        box-shadow:
          0 24px 70px #0005,
          0 0 36px #00e5a022,
          inset 0 1px #ffffff30;
        animation: panel-glow 4s ease-in-out infinite alternate;
      }
      .panel::before {
        position: absolute;
        z-index: -1;
        inset: 10px;
        border: 1px solid #ffffff0b;
        border-radius: 17px;
        background-image: radial-gradient(#ffffff15 0.7px, transparent 0.7px);
        background-size: 16px 16px;
        content: "";
        pointer-events: none;
      }
      .panel > * {
        position: relative;
        z-index: 1;
      }
      .mission-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100%, 560px);
        margin-bottom: 4px;
        color: #ffffff9c;
        font: 700 0.72rem/1.4 monospace;
        letter-spacing: 0.12em;
      }
      .mission-kicker {
        color: var(--ac);
      }
      .mission-progress {
        display: flex;
        gap: 6px;
        width: min(100%, 560px);
        margin: 8px 0 12px;
      }
      .mission-progress span {
        flex: 1;
        height: 5px;
        background: #ffffff20;
        border-radius: 999px;
      }
      .mission-progress .passed {
        background: #00e5a0;
        box-shadow: 0 0 10px #00e5a080;
      }
      .mission-progress .current {
        background: #ffd400;
        box-shadow: 0 0 12px #ffd40080;
      }
      #ds {
        min-height: 1.5em;
        color: #d7ffeF;
      }
      @keyframes panel-glow {
        to {
          border-color: #00e5a0b0;
          box-shadow:
            0 24px 70px #0005,
            0 0 44px #00e5a033,
            inset 0 1px #ffffff30;
        }
      }
      .side {
        width: min(100%, 200px);
        height: min(21vh, 190px);
        object-fit: contain;
        filter: drop-shadow(0 14px 18px #0005);
        animation: bob 1.2s infinite alternate ease-in-out;
      }
      .side.r {
        animation-delay: 0.6s;
      }
      @keyframes bob {
        to {
          transform: translateY(-14px) rotate(6deg);
        }
      }
      @media (max-width: 1000px) {
        .stage {
          gap: 12px;
        }
        .panel {
          flex: 0 1 60vw;
          min-height: min(58vh, 520px);
        }
        .game-side {
          flex: 1 1 130px;
          max-width: 150px;
        }
        .side-card {
          padding: 8px;
        }
        .side-card span {
          letter-spacing: 0.06em;
        }
      }
      @media (max-width: 760px) {
        #app {
          padding: 48px 10px 12px;
        }
        .game-side {
          display: none;
        }
        .panel {
          flex: 1 1 100%;
          min-height: min(54vh, 500px);
        }
        .boss-shell {
          padding: 14px 10px;
          border-radius: 18px;
        }
        .boss-hud {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .boss-stats {
          justify-content: stretch;
        }
        .boss-stat {
          flex: 1;
        }
        .bx {
          width: 100%;
          max-height: min(32vh, 220px);
          border-radius: 14px;
        }
        .boss-actions .ub {
          min-width: 0;
        }
      }
      @media (max-width: 480px) {
        .panel {
          border-radius: 18px;
          padding: 14px 10px;
        }
        .mission-top {
          font-size: 0.62rem;
        }
        .mission-progress {
          gap: 4px;
        }
      }
      .tip {
        margin-top: 12px;
        padding: 7px 14px;
        color: #ffffffbd;
        font-size: 0.82rem;
        background: #ffffff0d;
        border: 1px solid #ffffff1c;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="mq">
      <div>
        🔥 สมัครคอมโปรแกรมวันนี้ ฟรีค่าเทอม* (*ไม่ฟรี) 🔥 ไม่สมัครคอม =
        ไม่รักประเทศ 🤡 มีบั๊กฟรีทุกคน 🐛 กาแฟไม่อั้น (เหลือแต่เมล็ด) ☕
      </div>
    </div>
    <div id="cat-rain-layer" aria-hidden="true"></div>
    <div id="nav"></div>
    <div id="app"></div>

      const $ = (s) => document.querySelector(s),
        A = $("#app"),
        R = (n) => Math.floor(Math.random() * n);
      const phoneMode = () =>
        innerWidth <= 900 &&
        (matchMedia("(pointer: coarse)").matches ||
          navigator.maxTouchPoints > 0 ||
          /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent));
      const syncDeviceMode = () => {
        const phone = phoneMode();
        document.body.classList.toggle("is-phone", phone);
        const hint = $("#bossHint");
        if (hint?.dataset.state === "pre")
          hint.textContent = phone
            ? "📱 แตะเริ่ม แล้วลากนิ้วบนสนามเพื่อหลบกระสุน"
            : "🖥️ ใช้เมาส์หรือ WASD / ปุ่มลูกศร เพื่อหลบกระสุน";
        else if (hint?.dataset.state === "turn")
          hint.textContent = phone
            ? "ลากนิ้วบนสนามเพื่อบังคับหัวใจสีแดง หลบกระสุนให้ครบ!"
            : "เลื่อนเมาส์หรือใช้ WASD / ปุ่มลูกศร บังคับหัวใจสีแดงให้หลบกระสุน";
      };
      syncDeviceMode();
      window.addEventListener("resize", syncDeviceMode);
      window.addEventListener("orientationchange", syncDeviceMode);
      let T = [],
        rm = [],
        name = "",
        done = false,
        order = [],
        stage = 0,
        cur = "home",
        busy = 0,
        flags = { back: 0, exit: 0 },
        dead = { back: 0, exit: 0 };
      const clrT = () => {
        T.forEach((t) => {
          clearTimeout(t);
          clearInterval(t);
        });
        T = [];
      };
      const clr = () => {
        clrT();
        rm.forEach((f) => f());
        rm = [];
      };
      const st = (f, ms) => {
        const t = setTimeout(f, ms);
        T.push(t);
        return t;
      };
      const si = (f, ms) => {
        const t = setInterval(f, ms);
        T.push(t);
        return t;
      };
      const reset = () => {
        clr();
        busy = 0;

        (g) => {

            '<p>กดหยุดตอนเวลาใกล้ 3.00 วิ (±0.3) เวลาจะหายไปหลัง 1 วิ!</p><div class="big" id="tm">0.00</div><button class="b" id="x">เริ่ม</button>';
          let t0 = 0;
          const x = $("#x");
          x.onclick = () => {
            if (!t0) {
              t0 = performance.now();
              x.textContent = "หยุด!";
              si(() => {
                const s = (performance.now() - t0) / 1000;
                $("#tm").textContent = s < 1 ? s.toFixed(2) : "?.??";
              }, 30);
            } else {
              const s = (performance.now() - t0) / 1000;
              $("#tm").textContent = s.toFixed(2);
              if (Math.abs(s - 3) <= 0.3) ok();
              else no();
            }
          };
        },
        (g) => {
          const Q = [
            ["HTML เป็นภาษาโปรแกรมมิ่ง?", "ไม่ใช่ (เป็นภาษามาร์กอัป)", "ใช่"],
            ["บั๊ก (Bug) คืออะไร?", "ข้อผิดพลาดในโค้ด", "แมลงในเครื่อง"],
            ["Ctrl+Z คือ?", "ย้อนกลับ", "ปิดเครื่อง"],
            ["ไฟล์ .exe มักเป็น?", "โปรแกรมที่รันได้", "รูปภาพ"],
          ]
            .sort(() => Math.random() - 0.5)
            .slice(0, 3);
          let n = 0;
          const nx = () => {
            if (n >= 3) return ok();
            const q = Q[n],
              o = [q[1], q[2]].sort(() => Math.random() - 0.5);
            g.innerHTML =
              `<p>ข้อ ${n + 1}/3: ${q[0]}</p>` +
              o
                .map((t) => `<button class="b" data-a="${t}">${t}</button>`)
                .join("");
            g.onclick = (e) => {
              const a = e.target.dataset.a;
              if (a == null) return;
              if (a === q[1]) {
                n++;
                beep(600);
                nx();
              } else no();
            };
          };
          nx();
        },
        (g) => {
          const code = String(1000 + R(9000));
          g.innerHTML = `<p>จำรหัส 4 หลักให้ได้!</p><div class="big" id="memCode">${code}</div><input id="x" type="number" inputmode="numeric" placeholder="ใส่รหัส" disabled><button class="b" id="y" disabled>ตรวจรหัส</button>`;
          st(() => {
            $("#memCode").textContent = "🔒 • • • •";
            $("#x").disabled = false;
            $("#y").disabled = false;
            $("#x").focus();
          }, 1800);
          $("#y").onclick = () => ($("#x").value === code ? ok() : no());
          st(no, 15000);
        },
        (g) => {
          const steps = ["🧠 วางแผน", "⌨️ เขียนโค้ด", "🧪 ทดสอบ", "🚀 เผยแพร่"];
          const shuffled = [...steps].sort(() => Math.random() - 0.5);
          let n = 0;
          g.innerHTML =
            `<p>แตะตามลำดับขั้นตอนที่ถูกต้อง</p><p>${steps.join(" → ")}</p><div style="display:flex;flex-wrap:wrap;justify-content:center">` +
            shuffled
              .map(
                (step) =>
                  `<button class="b" data-step="${steps.indexOf(step)}">${step}</button>`,
              )
              .join("") +
            `</div><p>ถูกต้อง <span id="c">0</span>/4</p>`;
          g.onclick = (e) => {
            const step = e.target.dataset.step;
            if (step == null) return;
            if (+step === n) {
              e.target.disabled = true;
              $("#c").textContent = ++n;
              beep(500 + n * 80);
              if (n === steps.length) ok();
            } else no();
          };
          st(no, 15000);
        },
        (g) => {
          const target = ["🐛", "💻", "⌨️", "💾"][R(4)];
          const count = 3 + R(4);
          const icons = ["🐸", "⭐", "🍕", "🎈"];
          const cells = [...Array(24)].map(() => icons[R(icons.length)]);
          [...Array(24).keys()]
            .sort(() => Math.random() - 0.5)
            .slice(0, count)
            .forEach((i) => (cells[i] = target));
          g.innerHTML =
            `<p>นับ ${target} ให้ครบ แล้วใส่จำนวน</p><div style="display:grid;grid-template-columns:repeat(6,min(42px,8vh));gap:4px;justify-content:center;margin:10px auto">` +
            cells
              .map(
                (icon) =>
                  `<span class="h" style="display:grid;place-items:center;height:min(42px,8vh);font-size:1.2rem;background:#fff2">${icon}</span>`,
              )
              .join("") +
            '</div><input id="x" type="number" inputmode="numeric" min="0" max="24" placeholder="จำนวน"><button class="b" id="y">ตรวจคำตอบ</button>';
          $("#y").onclick = () => (+$("#x").value === count ? ok() : no());
          st(no, 18000);
        },
      ];

      /* บอส */
      function boss() {
        reset();
        syncDeviceMode();
        flash("sweat", 900);
        A.innerHTML = `
          <section class="boss-shell" aria-label="การต่อสู้บอส">
            <header class="boss-header">
              <div>
                <span class="boss-kicker">FINAL BOSS · MISSION 10</span>
                <h2 class="boss-title">🐴 ม้าอ้วนจอมพลัง</h2>
                <p class="boss-subtitle">เลือกวิธีต่อสู้ หรือใช้ ACT เพื่อหาทางออก</p>
              </div>
              <div class="boss-avatar" id="bo">
                <img src="${IMG.pony}" alt="ม้าอ้วนจอมพลัง">
              </div>
            </header>
            <div class="boss-hud">
              <div class="boss-meter">
                <div class="boss-meter-label"><span>🐴 BOSS HP</span><strong id="bhp">100%</strong></div>
                <div class="bar boss-bar"><i id="bh" style="width:100%"></i></div>
              </div>
              <div class="boss-stats">
                <div class="boss-stat"><span>❤️ พลังชีวิต</span><strong><span id="ph">20</span><small>/20</small></strong></div>
                <div class="boss-stat"><span>🥗 ส้มตำ</span><strong id="tm">3</strong></div>
              </div>
            </div>
            <div class="bx">
              <div id="dl"></div>
              <canvas id="cv" width="360" height="170"></canvas>
            </div>
            <p class="boss-hint" id="bossHint"></p>
            <div id="mn" class="boss-actions"></div>
          </section>`;
        let bh = 100,
          ph = 20,
          tm = 3,
          acted = 0;
        const BQ = [
          "* ม้าอ้วนกลิ้งเข้ามา",
          "* ม้าหายใจฟืดฟาด",
          "* ม้าทำหน้ามุ่งมั่น",
          "* กลิ่นส้มตำลอยมา...",
        ];
        const setBossHint = (state) => {
          const hint = $("#bossHint");
          hint.dataset.state = state;
          if (state === "menu")
            hint.textContent = "เลือกคำสั่งด้านล่างเพื่อสู้หรือใช้ไอเทม";
          else if (state === "fight")
            hint.textContent = "กดโจมตีเมื่อเข็มอยู่ในแถบสีเขียว";
          else syncDeviceMode();
        };
        const $dl = (t) => {
          $("#dl").style.display = "block";
          $("#cv").style.display = "none";
          $("#dl").textContent = t;
        };
        const mn = (arr) => {
          $("#mn").innerHTML = arr
            .map(
              (x, i) => `<button class="b ub" data-i="${i}">${x[0]}</button>`,
            )
            .join("");
          $("#mn").onclick = (e) => {
            const i = e.target.dataset.i;
            if (i != null && !busy) arr[i][1]();
          };
        };
        const upd = () => {
          $("#bh").style.width = Math.max(bh, 0) + "%";
          $("#bhp").textContent = Math.max(bh, 0) + "%";
          $("#ph").textContent = Math.max(ph, 0);
          $("#tm").textContent = tm;
        };
        const say = (t) => {
          $dl(t);
          mn([]);
          st(turn, 1400);
        };
        const win = (sk) => {
          if (busy) return;
          busy = 1;
          clr();
          mn([]);
          $dl(
            sk == 1
              ? "* บอสตกใจจนเลือดหมด ล้มไปเอง 🤡 คุณชนะ!"
              : sk == 2
                ? "* คุณไว้ชีวิตม้า ม้าซึ้งใจเดินจากไป 😭"
                : "* คุณล้มม้าอ้วนได้จริง!! 💪",
          );
          if (sk != 2) {
            $("#bh").style.width = "0";
            $("#bo").classList.add("die");
          }
          [500, 400, 300, 200].forEach((f, i) =>
            setTimeout(() => beep(f, 0.2), i * 200),
          );
          if (sk == 1) flash("cinema", 2200);
          st(finish, 2800);
        };
        const over = () => {
          clr();
          mn([]);
          $dl("* GAME OVER... คุณแพ้ม้าอ้วน 💀");
          scream();
          st(boss, 1500);
        };
        const pre = () => {
          $dl("* ม้าอ้วนทรงพลังขวางทางอยู่!");
          setBossHint("pre");
          mn([
            ["⚔️ เริ่มสู้", menu],
            ["😭 ไม่อยากสู้บอส", () => win(1)],
          ]);
        };
        const menu = () => {
          $dl(acted ? "* ม้าดูใจอ่อนลง... (ไว้ชีวิตได้แล้ว)" : BQ[R(4)]);
          setBossHint("menu");
          mn([
            ["⚔️ FIGHT", fight],
            ["🗨️ ACT", act],
            ["🎒 ITEM", item],
            ["💛 MERCY", mercy],
          ]);
        };
        const fight = () => {
          let x = 0,
            d = 1;
          setBossHint("fight");
          $("#dl").innerHTML =
            '* กดหยุดให้ตรงกลาง!<div style="position:relative;height:18px;background:#fff3;margin:8px auto;width:90%"><div style="position:absolute;left:45%;width:10%;top:0;bottom:0;background:#0c6"></div><div id="sw" style="position:absolute;top:-3px;bottom:-3px;width:6px;background:#fff"></div></div>';
          const sv = si(() => {
            x += d * 2.2;
            if (x >= 94 || x <= 0) d = -d;
            $("#sw").style.left = x + "%";
          }, 16);
          mn([
            [
              "🎯 โจมตี!",
              () => {
                clearInterval(sv);
                const m = Math.max(
                  3,
                  Math.round(35 * (1 - Math.abs(x - 47) / 47)),
                );
                bh -= m;
                upd();
                beep(300, 0.1, "sawtooth");
                $dl("* โจมตี! ความเสียหาย " + m);
                mn([]);
                if (bh <= 0) win(0);
                else st(turn, 1000);
              },
            ],
          ]);
        };
        const act = () =>
          mn([
            [
              "🔍 ตรวจดู",
              () => say("* ม้าอ้วนทรงพลัง ATK 0 DEF 999 กลมจนไม่มีมุมให้โจมตี"),
            ],
            [
              "😍 ชมว่าน่ารัก",
              () => {
                acted = 1;
                say("* ม้าเขินจนหน้าแดง ใจอ่อนลง (ไว้ชีวิตได้แล้ว!)");
              },
            ],
            [
              "🍽️ ยื่นส้มตำ",
              () => {
                flash("som", 900);
                say("* ม้ากินส้มตำเผ็ดจนน้ำตาไหล!");
              },
            ],
            ["↩️ กลับ", menu],
          ]);
        const item = () => {
          if (tm > 0) {
            tm--;
            ph = Math.min(20, ph + 10);
            upd();
            beep(900, 0.2);
            say("* กินส้มตำ HP +10 (เหลือ " + tm + " จาน)");
          } else $dl("* ส้มตำหมดแล้ว!");
        };
        const mercy = () =>
          mn([
            [
              "💛 ไว้ชีวิต",
              () => (acted ? win(2) : say("* ม้ายังไม่ยอมจบ... ลอง ACT ก่อน")),
            ],
            ["😭 ไม่อยากสู้บอส", () => win(1)],
            ["↩️ กลับ", menu],
          ]);
        function turn() {
          mn([]);
          setBossHint("turn");
          const cv = $("#cv");
          $("#dl").style.display = "none";
          cv.style.display = "block";
          const c = cv.getContext("2d"),
            W = 360,
            H = 170,
            pat = R(3);
          let hx = W / 2,
            hy = H / 2,
            B = [],
            t = 0,
            inv = 0;
          const mv = (e) => {
            const r = cv.getBoundingClientRect(),
              p = e.touches ? e.touches[0] : e;
            hx = Math.max(
              8,
              Math.min(W - 8, ((p.clientX - r.left) * W) / r.width),
            );
            hy = Math.max(
              8,
              Math.min(H - 8, ((p.clientY - r.top) * H) / r.height),
            );
          };
          cv.onmousemove = mv;
          cv.onpointermove = mv;
          cv.ontouchmove = (e) => {
            e.preventDefault();
            mv(e);
          };
          cv.style.touchAction = "none";
          const K = {},
            kd = (e) => {
              K[e.key.toLowerCase()] = 1;
              if (e.key.startsWith("Arrow")) e.preventDefault();
            },
            ku = (e) => {
              K[e.key.toLowerCase()] = 0;
            };
          document.addEventListener("keydown", kd);
          document.addEventListener("keyup", ku);
          rm.push(() => {
            document.removeEventListener("keydown", kd);
            document.removeEventListener("keyup", ku);
          });
          si(() => {
            t++;
            const s = 3.5;
            if (K.arrowleft || K.a) hx -= s;
            if (K.arrowright || K.d) hx += s;
            if (K.arrowup || K.w) hy -= s;
            if (K.arrowdown || K.s) hy += s;
            hx = Math.max(8, Math.min(W - 8, hx));
            hy = Math.max(8, Math.min(H - 8, hy));
            if (pat == 0 && t % 7 == 0)
              B.push({
                x: R(W),
                y: -5,
                vx: 0,
                vy: 2.4 + Math.random() * 1.6,
                r: 5,
              });
            if (pat == 1 && t % 25 == 0) {
              const a = Math.atan2(hy, hx - W / 2);
              B.push({
                x: W / 2,
                y: 0,
                vx: Math.cos(a) * 3.2,
                vy: Math.sin(a) * 3.2,
                r: 7,
              });
            }
            if (pat == 2 && t % 45 == 0) {
              const g = R(5);
              for (let i = 0; i < 8; i++)
                if (i != g && i != g + 1)
                  B.push({ x: i * 45 + 22, y: -5, vx: 0, vy: 2.4, r: 8 });
            }
            c.fillStyle = "#000";
            c.fillRect(0, 0, W, H);
            B = B.filter((b) => {
              b.x += b.vx;
              b.y += b.vy;
              if (b.x < -12 || b.x > W + 12 || b.y > H + 12) return false;
              c.fillStyle = "#fff";
              c.beginPath();
              c.arc(b.x, b.y, b.r, 0, 7);
              c.fill();
              if (!inv && ph > 0 && Math.hypot(b.x - hx, b.y - hy) < b.r + 5) {
                ph -= 3;
                inv = 60;
                upd();
                beep(150, 0.2, "sawtooth");
                if (ph <= 0) over();
              }
              return true;
            });
            if (inv > 0) inv--;
            if (!inv || t % 6 < 3) {
              c.fillStyle = "#f22";
              c.font = "18px sans-serif";
              c.textAlign = "center";
              c.textBaseline = "middle";
              c.fillText("❤", hx, hy);
            }
            if (t >= 380 && ph > 0) {
              clr();
              menu();
            }
          }, 16);
        }
        pre();
      }
      function finish() {
        reset();
        done = true;
        cur = "done";
        navUpdate();
        A.innerHTML = `<img class="m" src="${IMG.cinema}" style="max-height:26vh"><div class="big" style="font-size:2rem">🎉👨‍💻🎉</div><h1>ยินดีด้วย <span>${name.replace(/[<>&]/g, "")}</span>!</h1><p>คุณเป็นนักศึกษาสาขาคอมโปรแกรมเรียบร้อย<br>ผ่านครบ 10 ด่าน สมัครสำเร็จ 100% 🏆</p><button class="b" id="bk">🏠 กลับหน้าปก (ปุ่มปกติแล้ว)</button>`;
        $("#bk").onclick = home;
        [500, 600, 700, 900].forEach((f, i) =>
          setTimeout(() => beep(f, 0.2, "triangle"), i * 150),
        );
        for (let i = 0; i < 30; i++) {
          const c = document.createElement("div");
          c.className = "cf";
          if (i % 4 == 0)
            c.innerHTML = '<img src="' + IMG.som + '" style="height:40px">';
          else c.textContent = ["🎊", "🎉", "💻", "🐛", "⭐"][R(5)];
          c.style.left = R(95) + "%";
          c.style.animationDelay = Math.random() * 1.5 + "s";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 5000);
        }
      }
      const TIPS = [
        "💡 เคล็ดลับ: ถ้าแพ้ ยายกรีดอาจมาหา",
        "💡 ปุ่มย้อนกลับกำลังซ้อมวิ่งอยู่",
        "💡 สาขาอื่นไม่มีส้มตำแจก",
        "💡 โปรแกรมเมอร์ที่ดีต้องไม่กลัวบั๊ก",
        "💡 ม้าอ้วนรออยู่ที่ด่าน 10 🐴",
      ];
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("span");
        d.className = "dc";
        d.textContent = ["</>", "{ }", "01", "🐛", "💻", "⌨️", "if()"][R(7)];
        d.style.cssText = `left:${R(96)}%;animation-duration:${12 + R(18)}s;animation-delay:-${R(20)}s;font-size:${1.2 + Math.random() * 2}rem`;
        document.body.appendChild(d);
      }
      function catRain() {
        const layer = $("#cat-rain-layer");
        if (!layer || matchMedia("(prefers-reduced-motion: reduce)").matches)
          return;
        const c = document.createElement("img");
        const duration = 10 + Math.random() * 7;
        const elapsed = Math.random() * duration;
        const width = 34 + R(32);
        c.src = IMG.cat;
        c.className = "rc";
        c.alt = "";
        c.style.cssText = `left:${R(Math.max(1, innerWidth - width))}px;width:${width}px;--duration:${duration}s;--drift:${R(181) - 90}px;--opacity:${0.1 + Math.random() * 0.1};animation-delay:-${elapsed}s`;
        layer.appendChild(c);
        setTimeout(() => c.remove(), (duration - elapsed) * 1000 + 300);
      }
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        for (let i = 0; i < 16; i++) catRain();
        setInterval(catRain, 900);
      }
      home();
    </script>
  </body>
</html>
